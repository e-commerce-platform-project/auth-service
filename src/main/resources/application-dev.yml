server:
  port: 0

application:
  keycloak:
    serverUrl: ${KEYCLOAK_URL:http://localhost:8080}
    realmUrl: ${application.keycloak.serverUrl}/realms/${application.keycloak.realm}
    tokenUrl: ${application.keycloak.realmUrl}/protocol/openid-connect/token
    realm: ecommerce-platform-project
    clientId: auth-service
    clientSecret: RFldp0ODcs0qPUgttZp0tKzVKgFRJPno
    adminUsername: admin
    adminPassword: admin
    adminClientId: admin-cli

spring:
  application:
    name: auth-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/ecommerce-platform-project
            token-uri: http://localhost:8080/realms/ecommerce-platform-project/protocal/openid-connect/token


  kafka:
    bootstrap-servers: localhost:29092, localhost:39092, localhost:49092
    producer:
      acks: all
    consumer:
      properties:
        spring.json.trusted.packages: "ru.ivanov.ecommerceplatformproject.sharedlibs.event*"

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

kafka:
  topics:
    user-registered: user-registered-event-topic
    verification-code-issued: verification-code-issued-event-topic