keycloak:
  server-url: http://keycloak:8080
  realm: myrealm
  client-id: backend-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin-username: admin
  admin-password: admin

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/